<section id="{{ section.section_id }}" class="page-section {{ section.background_style }}" style="padding-bottom: 0;">
  <div class="container px-4 px-lg-5">
    <h2 class="text-center mt-0">{{ section.title }}</h2>
    <hr class="divider border border-primary border-2">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-lg-8">
        <div style="position: relative; padding-bottom: 56.25%; height: 0;">
          <iframe src="{{ section.video_url }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
